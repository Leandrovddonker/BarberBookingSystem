<dialog
  #dialog
  [attr.aria-labelledby]="titleId"
  [attr.aria-busy]="busy()"
  aria-modal="true"
  (cancel)="onCancel($event)"
>
  <div class="modal-header">
    <h2 [id]="titleId" tabindex="-1" autofocus>{{ title() }}</h2>
  </div>
  <div class="modal-body">
    <ng-content />
  </div>
</dialog>
